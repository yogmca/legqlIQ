# render.yaml - LegalIQ single-container deployment for Render
# ONE web service runs BOTH the React frontend (nginx) and the Node backend.
# nginx listens on Render's $PORT and proxies /api, /uploads and /socket.io
# to the backend running internally on port 4000.
# Because everything is served from the same origin, there are NO CORS issues.

services:
  - type: web
    name: legaliq
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    # nginx serves "/" so the health check should hit the SPA root (returns 200).
    healthCheckPath: /

    envVars:
      # Node backend runtime
      - key: NODE_ENV
        value: production

      # MongoDB Connection (REQUIRED for lawyers to load)
      - key: MONGODB_URI
        sync: false

      # JWT / Session
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SESSION_SECRET
        sync: false

      # URLs - same-origin single service. Set to the public service URL.
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Email
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false

      # WhatsApp (MSG91)
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_WHATSAPP_INTEGRATED_NUMBER_ID
        sync: false
      - key: ADMIN_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_ENABLED
        sync: false
      - key: MSG91_WHATSAPP_NAMESPACE
        sync: false
